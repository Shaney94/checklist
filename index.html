<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet"><meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<title>Turnli — Log in</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><meta name="application-name" content="Turnli"><meta name="apple-mobile-web-app-title" content="Turnli"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#123c30">
<style>
:root{--bg:#f8faf9;--text:#142a24;--muted:#56665f;--accent:#087d3e;--border:#d5dfda;--soft:#e8f5ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}main{width:min(440px,100%);margin:auto;padding:36px 20px 48px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:32px;margin-bottom:36px}.brand img{width:44px;height:44px}.card{background:white;border:1px solid var(--border);border-radius:20px;padding:28px}h1{font-size:28px;margin:0 0 10px}p{color:var(--muted);line-height:1.5;margin:0 0 24px}label{display:block;font-size:14px;font-weight:650;margin:18px 0 7px}input{width:100%;min-height:48px;border:1px solid var(--border);border-radius:12px;padding:12px;font:inherit;color:var(--text);background:white}button{min-height:46px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:white;color:var(--text);font:inherit;font-size:14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:white;border-color:var(--accent);width:100%;margin-top:20px}.secondary{width:100%;background:var(--soft);color:#164e3d;border-color:#81a996}.text-button{border:0;background:transparent;padding:8px 0;color:#115b49;text-decoration:underline;min-height:44px}.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:16px 0}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--border)}[hidden]{display:none!important}:focus-visible{outline:3px solid #087d3e;outline-offset:3px}button:disabled{cursor:wait;color:#56665f;background:#edf1ef;border-color:var(--border)}#loginStatus{margin:18px 0 0;font-size:14px;color:#a52218;overflow-wrap:anywhere}.helper{font-size:13px;margin:8px 0;color:var(--muted)}.code-actions{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}.tagline{text-align:center;font-size:13px;margin-top:26px}@media(max-width:400px){main{padding:24px 14px}.card{padding:22px}.brand{margin-bottom:24px}}
</style></head>
<body><main><div class="brand"><img src="icons/turnli.svg" alt=""><span>turnli</span></div><section class="card" aria-labelledby="loginTitle">
<h1 id="loginTitle">Welcome back</h1><p id="loginIntro">Log in to manage your properties and cleaning.</p>
<form id="passwordForm"><label for="loginEmail">Email address</label><input id="loginEmail" type="email" autocomplete="username" required maxlength="254"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required maxlength="1024"><button type="submit" class="primary">Log in →</button><button id="forgotPassword" class="text-button" type="button">Forgot password?</button><p class="helper">New to Turnli? <button type="button" class="text-button" id="createAccount">Create an account</button></p><div class="divider">or</div><button id="emailLoginCode" class="secondary" type="button">Email me a login code</button></form>
<form id="registerForm" hidden><label for="registerEmail">Email address</label><input id="registerEmail" type="email" autocomplete="username" required maxlength="254"><label for="registerPassword">Password</label><input id="registerPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="1024"><p class="helper" id="registerRequirements">Use a strong password of at least 8 characters.</p><label for="registerConfirm">Confirm password</label><input id="registerConfirm" type="password" autocomplete="new-password" required minlength="8" maxlength="1024"><button class="primary" type="submit">Create account →</button><p class="helper">Already have an account? <button class="text-button" id="registrationLogin" type="button">Log in</button></p></form>
<form id="codeForm" hidden><p id="codeSentTo"></p><label for="loginCode">Email code</label><input id="loginCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><div id="newPasswordFields" hidden><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="1024"><p id="passwordRequirements" class="helper">Use at least 8 characters, including uppercase and lowercase letters, a number and a symbol.</p><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="1024"></div><button type="submit" class="primary" id="verifyLogin">Log in →</button><div class="code-actions"><button type="button" id="resendCode" class="text-button">Resend code</button><button type="button" id="backToPassword" class="text-button">Log in with password</button></div></form>
<div id="registrationRecovery" hidden><button class="secondary" type="button" id="continueRegistration">Continue with email code</button></div><p id="loginStatus" role="status" aria-live="polite"></p></section><p class="tagline">Cleaning without the managing.</p></main><script src="login.js"></script></body></html>
